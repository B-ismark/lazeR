name: win-diag (temporary)
on:
  push:
    branches: [claude/dreamy-dirac-6dmpvz]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14.3'
      - name: Install
        shell: pwsh
        run: python -m pip install --quiet --require-hashes -r tools/build-requirements.lock
      - name: From source
        shell: pwsh
        run: python tools/win_diag.py
      - name: Frozen
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name diag --paths server `
            --hidden-import remote_server --collect-all comtypes --collect-all pycaw `
            --collect-all zeroconf --collect-submodules pynput --collect-all pystray `
            --exclude-module comtypes.test tools/win_diag.py | Out-Null
          ./dist/diag.exe
