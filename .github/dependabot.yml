# Actions are pinned to commit SHAs (a moved tag can't change what runs while the
# signing key is on disk); Dependabot proposes the bumps as reviewable PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # v6 moved setup-gradle's caching into a proprietary component under
      # Gradle's own terms (gradle.com/legal/terms-of-use); v5 is MIT throughout.
      # Taking v6 means accepting those terms, which is the owner's decision.
      - dependency-name: gradle/actions*
        update-types: [version-update:semver-major]
