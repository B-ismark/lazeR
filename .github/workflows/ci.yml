name: CI

# The secure (L3) wire is implemented twice (Python `Wire` + Kotlin `SecureChannel`)
# and must agree byte for byte. Both suites assert the SAME golden packet, so this
# workflow is what stops the two drifting apart.
# push is limited to main: any other branch worth testing has a PR, and
# `pull_request` already covers those. Including feature branches here ran every
# push twice (one push run + one pull_request run) for no extra signal.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: nothing here publishes or writes to the repo.
permissions:
  contents: read

jobs:
  server:
    name: server — wire tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      # Only cryptography is needed: the tests stub pynput, so no input backend
      # and no X11 display are required (that's why they run headless in CI at all).
      - name: Install test dependencies
        run: python -m pip install --quiet --disable-pip-version-check cryptography

      - name: Syntax-check the server
        run: python -m py_compile server/remote_server.py

      # -t is the tests dir itself so discovery imports test_wire directly and the
      # repo needs no __init__.py packages.
      - name: Wire + dispatch tests
        run: python -m unittest discover -s server/tests -t server/tests -v

  android:
    name: android — unit tests + debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' — the action's default installs the obsolete `tools`
      # package, which Google removed from the SDK repo, so sdkmanager exits 1
      # before Gradle ever runs. The step below installs what the build needs.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
        with:
          packages: ''

      # Pinned toolchain — see android/EXPRESSIVE_MIGRATION.md. material3 is held
      # at 1.5.0-alpha12, which keeps compileSdk 35 / AGP 8.7.3 / Gradle 8.9.
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4

      # Debug only: assembleRelease signs with the local ~/.android/debug.keystore
      # "sideload" config, which doesn't exist on a runner.
      # No --stacktrace: on a Kotlin compile error it buries the actual
      # "e: file://... error: ..." lines under ~120 lines of Gradle internals, which
      # makes the log unreadable from an API tail. Compile errors and test failures
      # both print clearly without it.
      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Debug build
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
